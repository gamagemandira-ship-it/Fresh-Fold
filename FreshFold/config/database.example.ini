; ============================================================================
; FreshFold - MySQL connection settings (EXAMPLE)
;
; 1. Copy this file to   config\database.ini   (same folder).
; 2. Put your real MySQL user name and password in database.ini.
; 3. database.ini is listed in .gitignore, so your password is never
;    uploaded to GitHub. Do NOT put a real password in this example file.
; ============================================================================

[mysql]
server=localhost
port=3306
database=freshfold_db
user=freshfold_app
password=Admin@1234
